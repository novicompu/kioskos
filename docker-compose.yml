services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portalpayjoy
    ports:
      - "5433:5432"
    volumes:
      - portalpayjoy_postgres_data:/var/lib/postgresql/data

volumes:
  portalpayjoy_postgres_data:
